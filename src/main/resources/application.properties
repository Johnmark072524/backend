spring.application.name=backend
server.port=8080

# ==========================================
# ☁️ SUPABASE CLOUD DATABASE (Active)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 🗄️ SUPABASE OBJECT STORAGE
# ==========================================
supabase.url=${SUPABASE_URL:https://elojstmlgvgpvdtitqib.supabase.co}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.bucket-name=road-reports

spring.profiles.active=dev

# Automatically creates tables in the cloud
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Increase maximum upload size for multi-angle RoadWise image reports
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=35MB

# ==========================================
# 📧 TRANSACTIONAL EMAIL API (HTTPS / BREVO)
# ==========================================
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=csjdmroadwise@gmail.com
brevo.sender.name=RoadWise CSJDM

ai.service.url=${AI_SERVICE_URL:https://roadwise-ai-service-v2.onrender.com}

# ==========================================
# 🌐 CORS / FRONTEND ORIGIN CONFIGURATION
# ==========================================
frontend.url=${FRONTEND_URL:https://roadwise-csjdm.com}

# ==========================================
# 🛡️ CONTROL 17: EDGE PROXY TLS & HSTS RECOGNITION
# ==========================================
server.forward-headers-strategy=framework

# ==========================================
# 🛡️ CONTROL 19: HIKARICP CONNECTION POOL & RESOURCE BOUNDS
# ==========================================
# Maximum active database connections (prevents exhausting Supabase pooler limit)
spring.datasource.hikari.maximum-pool-size=10
# Minimum idle connections ready in pool
spring.datasource.hikari.minimum-idle=2
# Timeouts to prevent hanging threads / connection starvation (20 seconds)
spring.datasource.hikari.connection-timeout=20000
# Idle connection recycle timeout (5 minutes)
spring.datasource.hikari.idle-timeout=300000
# Maximum connection lifetime (20 minutes)
spring.datasource.hikari.max-lifetime=1200000
# Leak detection threshold (logs a warning if a query holds a connection > 15s)
spring.datasource.hikari.leak-detection-threshold=15000

# ==========================================
# 🛡️ CONTROL 20 & 23: SAFE ERROR SANITIZATION & DIAGNOSTICS
# ==========================================
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=always
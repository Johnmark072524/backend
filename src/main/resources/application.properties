spring.application.name=backend
server.port=8080

# ==========================================
# ☁️ SUPABASE CLOUD DATABASE (Active)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 🗄️ SUPABASE OBJECT STORAGE
# ==========================================
supabase.url=${SUPABASE_URL:https://elojstmlgvgpvdtitqib.supabase.co}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.bucket-name=road-reports

spring.profiles.active=dev

# Automatically creates tables in the cloud
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Increase maximum upload size for RoadWise image reports
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==========================================
# 📧 TRANSACTIONAL EMAIL API (HTTPS / BREVO)
# ==========================================
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=csjdmroadwise@gmail.com
brevo.sender.name=RoadWise CSJDM

ai.service.url=${AI_SERVICE_URL:https://roadwise-ai-service-v2.onrender.com}